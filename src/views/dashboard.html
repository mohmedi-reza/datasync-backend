<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DataSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #111827;
      --muted: #6b7280;
      --soft: #9ca3af;
      --line: #eceff3;
      --surface: #ffffff;
      --page: #f3f4f6;
      --accent: #111827;
      --danger: #b42318;
      --sms-bubble: #e8f5e9;
      --sms-ink: #0f3d2e;
      --wa: #25d366;
      --tg: #2aabee;
      --ig: #e1306c;
      --call: #2563eb;
      --missed: #dc2626;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Outfit", "Vazirmatn", system-ui, sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    .shell {
      width: min(520px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      background: var(--surface);
      border-inline: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      padding: 18px 20px 0;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .live i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16a34a;
      animation: pulse 1.8s ease infinite;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .tab {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 12px 8px 14px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--soft);
      cursor: pointer;
      position: relative;
    }

    .tab strong {
      display: inline-block;
      margin-inline-start: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      color: inherit;
      opacity: 0.8;
    }

    .tab.active {
      color: var(--ink);
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 0;
      height: 2px;
      border-radius: 999px;
      background: var(--ink);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      background: #fafafa;
    }

    .toolbar span {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .actions button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .actions button:hover {
      background: #eef0f3;
      color: var(--ink);
    }

    .actions button.danger:hover {
      background: #fef3f2;
      color: var(--danger);
    }

    .feed {
      flex: 1;
      padding: 12px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty {
      margin: 48px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* —— SMS message style —— */
    .msg {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 10px;
      padding: 10px 8px;
      border-radius: 18px;
      animation: fadeIn 0.28s ease both;
    }

    .msg:hover { background: #f9fafb; }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      background: #374151;
      flex-shrink: 0;
    }

    .avatar.sms { background: #0f766e; }
    .avatar.wa { background: var(--wa); }
    .avatar.tg { background: var(--tg); }
    .avatar.ig { background: var(--ig); }
    .avatar.call { background: var(--call); }
    .avatar.missed { background: var(--missed); }

    .msg-main { min-width: 0; }

    .msg-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }

    .sender {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .when {
      font-size: 0.72rem;
      color: var(--soft);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .bubble {
      display: inline-block;
      max-width: 100%;
      margin: 0;
      padding: 10px 12px;
      border-radius: 4px 16px 16px 16px;
      background: var(--sms-bubble);
      color: var(--sms-ink);
      font-family: "Vazirmatn", "Outfit", sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.rtl {
      direction: rtl;
      text-align: right;
      border-radius: 16px 4px 16px 16px;
    }

    /* —— Social notification style —— */
    .notif {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      align-items: start;
      padding: 14px 12px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      animation: fadeIn 0.28s ease both;
    }

    .notif-body { min-width: 0; }

    .notif-app {
      margin: 0 0 2px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--soft);
    }

    .notif-title {
      margin: 0 0 4px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .notif-text {
      margin: 0;
      font-family: "Vazirmatn", "Outfit", sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .notif-text.rtl {
      direction: rtl;
      text-align: right;
    }

    .notif-meta {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--soft);
    }

    /* —— Call log style —— */
    .call {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 12px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #fff;
      animation: fadeIn 0.28s ease both;
    }

    .call-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eff6ff;
      color: var(--call);
    }

    .call-icon.missed {
      background: #fef2f2;
      color: var(--missed);
    }

    .call-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .call-name {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .call-sub {
      margin: 3px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .call-sub.missed { color: var(--missed); }

    .call-time {
      font-size: 0.75rem;
      color: var(--soft);
      white-space: nowrap;
      align-self: start;
      padding-top: 4px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.35); }
      70% { box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .shell { border-inline: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="top">
        <h1 class="brand">DataSync</h1>
        <div class="live"><i></i> Live</div>
      </div>
      <nav class="tabs" aria-label="Channels">
        <button type="button" class="tab active" data-tab="sms">SMS <strong id="count-sms">0</strong></button>
        <button type="button" class="tab" data-tab="social">Social <strong id="count-social">0</strong></button>
        <button type="button" class="tab" data-tab="calls">Calls <strong id="count-calls">0</strong></button>
      </nav>
    </header>

    <div class="toolbar">
      <span id="subtitle">Messages</span>
      <div class="actions">
        <button type="button" id="refreshBtn">Refresh</button>
        <button type="button" class="danger" id="clearBtn">Clear</button>
      </div>
    </div>

    <section class="feed" id="feed" aria-live="polite"></section>
  </div>

  <script>
    const TABS = {
      sms: {
        subtitle: "Messages",
        empty: "No SMS yet",
        match: (type) => type === "SMS",
      },
      social: {
        subtitle: "Notifications",
        empty: "No social notifications yet",
        match: (type) => ["WHATSAPP", "TELEGRAM", "INSTAGRAM", "SOCIAL", "NOTIFICATION"].includes(type),
      },
      calls: {
        subtitle: "Recents",
        empty: "No calls yet",
        match: (type) => ["CALL", "CALL_LOG", "CALLS"].includes(type),
      },
    };

    const feed = document.getElementById("feed");
    const subtitleEl = document.getElementById("subtitle");

    let activeTab = "sms";
    let allItems = [];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function normalizeType(value) {
      return String(value || "").trim().toUpperCase();
    }

    function isRtl(text) {
      return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(String(text || ""));
    }

    function initials(value) {
      const text = String(value || "?").trim();
      if (!text) return "?";
      const parts = text.replace(/^\+/, "").split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function formatWhen(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) {
        return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }
      return d.toLocaleString(undefined, {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function socialAvatarClass(type) {
      if (type === "WHATSAPP") return "wa";
      if (type === "TELEGRAM") return "tg";
      if (type === "INSTAGRAM") return "ig";
      return "tg";
    }

    function socialLabel(type) {
      if (type === "WHATSAPP") return "WhatsApp";
      if (type === "TELEGRAM") return "Telegram";
      if (type === "INSTAGRAM") return "Instagram";
      return type;
    }

    function parseCall(item) {
      const content = String(item.content || "");
      const parts = content.split("·").map((p) => p.trim()).filter(Boolean);
      const direction = parts[0] || "Call";
      const number = parts[1] || item.sender || "";
      const duration = parts[2] || "";
      const missed = /missed/i.test(direction);
      return { direction, number, duration, missed };
    }

    const phoneIcon = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z"/>
      </svg>`;

    function renderSms(item) {
      const rtl = isRtl(item.content) ? "rtl" : "";
      return `
        <article class="msg">
          <div class="avatar sms">${escapeHtml(initials(item.sender))}</div>
          <div class="msg-main">
            <div class="msg-top">
              <p class="sender">${escapeHtml(item.sender)}</p>
              <time class="when">${escapeHtml(formatWhen(item.receivedAt || item.timestamp))}</time>
            </div>
            <p class="bubble ${rtl}">${escapeHtml(item.content)}</p>
          </div>
        </article>`;
    }

    function renderSocial(item) {
      const type = normalizeType(item.messageType);
      const rtl = isRtl(item.content) ? "rtl" : "";
      return `
        <article class="notif">
          <div class="avatar ${socialAvatarClass(type)}">${escapeHtml(initials(item.sender))}</div>
          <div class="notif-body">
            <p class="notif-app">${escapeHtml(socialLabel(type))}</p>
            <p class="notif-title">${escapeHtml(item.sender)}</p>
            <p class="notif-text ${rtl}">${escapeHtml(item.content)}</p>
            <div class="notif-meta">${escapeHtml(formatWhen(item.receivedAt || item.timestamp))}</div>
          </div>
        </article>`;
    }

    function renderCall(item) {
      const parsed = parseCall(item);
      const missedClass = parsed.missed ? "missed" : "";
      const sub = [parsed.direction, parsed.number, parsed.duration].filter(Boolean).join(" · ");
      return `
        <article class="call">
          <div class="call-icon ${missedClass}">${phoneIcon}</div>
          <div>
            <p class="call-name">${escapeHtml(item.sender)}</p>
            <p class="call-sub ${missedClass}">${escapeHtml(sub)}</p>
          </div>
          <time class="call-time">${escapeHtml(formatWhen(item.receivedAt || item.timestamp))}</time>
        </article>`;
    }

    function renderItem(item) {
      if (activeTab === "sms") return renderSms(item);
      if (activeTab === "social") return renderSocial(item);
      return renderCall(item);
    }

    function filteredItems() {
      return allItems.filter((item) => TABS[activeTab].match(normalizeType(item.messageType)));
    }

    function updateCounts() {
      document.getElementById("count-sms").textContent =
        String(allItems.filter((i) => TABS.sms.match(normalizeType(i.messageType))).length);
      document.getElementById("count-social").textContent =
        String(allItems.filter((i) => TABS.social.match(normalizeType(i.messageType))).length);
      document.getElementById("count-calls").textContent =
        String(allItems.filter((i) => TABS.calls.match(normalizeType(i.messageType))).length);
    }

    function paint() {
      updateCounts();
      subtitleEl.textContent = TABS[activeTab].subtitle;
      const items = filteredItems();
      if (!items.length) {
        feed.innerHTML = `<div class="empty">${escapeHtml(TABS[activeTab].empty)}</div>`;
        return;
      }
      feed.innerHTML = items.map(renderItem).join("");
    }

    async function loadMessages() {
      try {
        const res = await fetch("/api/sync/messages?limit=100", { cache: "no-store" });
        if (!res.ok) throw new Error("Failed");
        const data = await res.json();
        allItems = Array.isArray(data.items) ? data.items : [];
        paint();
      } catch (_) {
        if (!feed.children.length) {
          feed.innerHTML = `<div class="empty">Could not reach the API</div>`;
        }
      }
    }

    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el === btn));
        paint();
      });
    });

    document.getElementById("refreshBtn").addEventListener("click", loadMessages);
    document.getElementById("clearBtn").addEventListener("click", async () => {
      if (!confirm("Clear all messages?")) return;
      await fetch("/api/sync/messages", { method: "DELETE" });
      await loadMessages();
    });

    loadMessages();
    setInterval(loadMessages, 2000);
  </script>
</body>
</html>
