<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DataSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --ink: #1b2559;
      --muted: #8f9bb3;
      --line: #eef1f7;
      --blue: #3b6ff5;
      --blue-soft: #e8effe;
      --green: #22c55e;
      --red: #ef4444;
      --wa: #25d366;
      --tg: #2aabee;
      --ig: #e1306c;
      --shadow: 0 10px 30px rgba(27, 37, 89, 0.06);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", "Vazirmatn", system-ui, sans-serif;
      position: fixed;
      inset: 0;
    }

    .phone {
      width: min(430px, 100%);
      height: 100%;
      margin: 0 auto;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
    }
    .phone.sheet-open .app-header,
    .phone.sheet-open .feed,
    .phone.sheet-open .bottom-nav,
    .phone.sheet-closing .app-header,
    .phone.sheet-closing .feed,
    .phone.sheet-closing .bottom-nav {
      pointer-events: none;
    }

    header.app-header {
      padding: 22px 20px 12px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 0;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 6;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      margin: 0;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .header-actions { display: flex; align-items: center; gap: 4px; }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .icon-btn:hover, .icon-btn.active { background: var(--line); color: var(--ink); }
    .icon-btn.danger { color: var(--red); }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }

    .search-box { display: none; margin-top: 12px; position: relative; }
    .search-box.open { display: block; }
    .search-box input {
      width: 100%;
      border: 0;
      outline: none;
      background: #f3f5fa;
      border-radius: 14px;
      padding: 12px 40px 12px 42px;
      font: inherit;
      font-size: 0.92rem;
      color: var(--ink);
    }
    .search-box .search-ico {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--muted);
    }
    .search-box .search-ico svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
    }
    .search-box .clear-ico-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      display: none;
      place-items: center;
      cursor: pointer;
    }
    .search-box .clear-ico-btn.show { display: grid; }
    .search-box .clear-ico-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }

    .select-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--blue-soft);
    }
    .select-bar.open { display: flex; }
    .select-bar strong { font-size: 0.9rem; }
    .select-bar .actions { display: flex; gap: 6px; }

    .feed {
      --feed-fade-top: 0px;
      --feed-fade-bottom: 0px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 4px 8px 20px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scroll-padding-bottom: 12px;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: rgba(143, 155, 179, 0.4) transparent;
      mask-image: linear-gradient(
        to bottom,
        transparent 0,
        #000 var(--feed-fade-top),
        #000 calc(100% - var(--feed-fade-bottom)),
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0,
        #000 var(--feed-fade-top),
        #000 calc(100% - var(--feed-fade-bottom)),
        transparent 100%
      );
    }
    .feed.can-scroll-up { --feed-fade-top: 16px; }
    .feed.can-scroll-down { --feed-fade-bottom: 22px; }
    .feed::-webkit-scrollbar {
      width: 5px;
    }
    .feed::-webkit-scrollbar-track {
      background: transparent;
      margin: 12px 0;
    }
    .feed::-webkit-scrollbar-thumb {
      background: rgba(143, 155, 179, 0.32);
      border-radius: 999px;
    }
    .feed::-webkit-scrollbar-thumb:hover {
      background: rgba(143, 155, 179, 0.52);
    }
    .feed::-webkit-scrollbar-thumb:active {
      background: rgba(59, 111, 245, 0.5);
    }
    @media (hover: none) and (pointer: coarse) {
      .feed {
        scrollbar-width: none;
        scrollbar-gutter: auto;
      }
      .feed::-webkit-scrollbar { display: none; }
    }

    .empty {
      margin: 64px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .swipe {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      margin-bottom: 2px;
      touch-action: pan-y;
    }

    .swipe-actions {
      position: absolute;
      inset: 0 auto 0 0;
      width: 76px;
      background: var(--red);
      display: grid;
      place-items: center;
      color: #fff;
      z-index: 0;
    }
    .swipe-actions svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }

    .swipe-front {
      position: relative;
      z-index: 1;
      background: var(--surface);
      transition: transform 0.18s ease;
      will-change: transform;
    }

    .row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: 18px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      animation: fadeIn 0.28s ease both;
    }
    .selecting .row { grid-template-columns: 28px 56px 1fr auto; }
    .row:hover, .row:active { background: #f8f9fd; }
    .row.selected { background: var(--blue-soft); }

    .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #c9d2e3;
      display: none;
      place-items: center;
      flex-shrink: 0;
    }
    .selecting .check { display: grid; }
    .row.selected .check {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .row.selected .check svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 3; }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      position: relative;
      flex-shrink: 0;
      background: #94a3b8;
    }
    .avatar.sms { background: linear-gradient(135deg, #60a5fa, #3b6ff5); }
    .avatar.wa { background: var(--wa); }
    .avatar.tg { background: var(--tg); }
    .avatar.ig { background: radial-gradient(circle at 30% 110%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
    .avatar.incoming { background: #dcfce7; color: #15803d; }
    .avatar.outgoing { background: var(--blue-soft); color: var(--blue); }
    .avatar.missed { background: #fee2e2; color: var(--red); }
    .avatar.other { background: #e2e8f0; color: #475569; }
    .avatar svg { width: 24px; height: 24px; stroke: currentColor; fill: none; }
    .avatar .badge-app {
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      display: grid;
      place-items: center;
    }
    .avatar .badge-app.wa { background: var(--wa); }
    .avatar .badge-app.tg { background: var(--tg); }
    .avatar .badge-app.ig { background: var(--ig); }
    .avatar .badge-app svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.5; }

    .row-main { min-width: 0; }
    .row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
    .name {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row.unread .name { font-weight: 800; }
    .row.unread .preview { color: var(--ink); font-weight: 600; }
    .row.unread .when { color: var(--blue); font-weight: 700; }
    .when { font-size: 0.75rem; font-weight: 500; color: var(--muted); white-space: nowrap; }
    .preview {
      margin: 0;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-family: "Vazirmatn", "Plus Jakarta Sans", sans-serif;
    }
    .preview.rtl { direction: rtl; text-align: right; }
    .meta-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; align-self: start; padding-top: 2px; }
    .count-badge {
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-grid;
      place-items: center;
    }

    .chat-thread {
      padding: 10px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      max-width: 88%;
      cursor: pointer;
      user-select: none;
      animation: fadeIn 0.28s ease both;
    }
    .msg-block.selected .bubble { outline: 2px solid var(--blue); }
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-inline: 4px;
    }
    .msg-meta .at { font-size: 0.72rem; color: var(--muted); font-weight: 500; }
    .bubble {
      margin: 0;
      padding: 12px 14px;
      border-radius: 4px 18px 18px 18px;
      background: #f1f4f9;
      font-family: "Vazirmatn", "Plus Jakarta Sans", sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.rtl { direction: rtl; text-align: right; border-radius: 18px 4px 18px 18px; }
    .bubble.clamp {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }
    .back-btn {
      display: none;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: -8px;
    }
    .back-btn.show { display: grid; }
    .back-btn:hover { background: var(--line); }
    .back-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
    .title.chat-title {
      font-size: 1.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .bottom-nav {
      flex-shrink: 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-top: 0;
      padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 5;
    }
    .nav-item {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px 2px;
      cursor: pointer;
      position: relative;
    }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
    .nav-item .dot-count {
      position: absolute;
      top: 0;
      right: calc(50% - 22px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      display: none;
      place-items: center;
    }
    .nav-item .dot-count.show { display: grid; }
    .nav-item.active { color: var(--ink); }
    .nav-item.active::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ink);
      margin-top: 2px;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(27, 37, 89, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
      z-index: 80;
      backdrop-filter: blur(2px);
      -webkit-tap-highlight-color: transparent;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: min(78vh, 640px);
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      box-shadow: 0 -18px 48px rgba(27, 37, 89, 0.16);
      transform: translate3d(0, 105%, 0);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 81;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      will-change: transform;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
    }
    .sheet.open {
      transform: translate3d(0, 0, 0);
      pointer-events: auto;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: #d5dbeb;
      margin: 10px auto 0;
      flex-shrink: 0;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 12px;
      flex-shrink: 0;
    }
    .sheet-head .avatar {
      width: 48px;
      height: 48px;
      font-size: 0.88rem;
      overflow: visible;
    }
    .sheet-head-text { min-width: 0; flex: 1; }
    .sheet-head-text h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sheet-head-text p {
      margin: 4px 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sheet-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #f3f5fa;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sheet-close:hover { background: var(--line); color: var(--ink); }
    .sheet-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }

    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 16px 8px;
      -webkit-overflow-scrolling: touch;
    }

    .sheet-bubble {
      margin: 0 0 16px;
      padding: 14px 16px;
      border-radius: 4px 18px 18px 18px;
      background: #f1f4f9;
      font-family: "Vazirmatn", "Plus Jakarta Sans", sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--ink);
    }
    .sheet-bubble.rtl {
      direction: rtl;
      text-align: right;
      border-radius: 18px 4px 18px 18px;
    }

    .sheet-meta {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--line);
      margin-top: 4px;
    }
    .sheet-meta-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .sheet-meta-row:last-child { border-bottom: 0; }
    .sheet-meta-row span {
      color: var(--muted);
      font-weight: 500;
      flex-shrink: 0;
    }
    .sheet-meta-row strong {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      color: var(--ink);
    }

    .sheet-section-title {
      margin: 18px 2px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .sheet-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; }
    .sheet-list-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #f5f7fb;
    }
    .sheet-list-item .when {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }
    .sheet-list-item .text {
      font-family: "Vazirmatn", "Plus Jakarta Sans", sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sheet-list-item .text.rtl { direction: rtl; text-align: right; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="phone" id="app">
    <header class="app-header">
      <div class="header-row">
        <div class="title-wrap">
          <button type="button" class="back-btn" id="backBtn" title="Back" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h1 class="title" id="pageTitle">Messages</h1>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="searchToggle" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button type="button" class="icon-btn" id="refreshBtn" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          </button>
          <button type="button" class="icon-btn" id="clearBtn" title="Clear all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
          </button>
        </div>
      </div>
      <div class="search-box" id="searchBox">
        <span class="search-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input id="searchInput" type="search" placeholder="Search messages..." autocomplete="off" />
        <button type="button" class="clear-ico-btn" id="searchClear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="select-bar" id="selectBar">
        <strong id="selectCount">0 selected</strong>
        <div class="actions">
          <button type="button" class="icon-btn" id="selectCancel" title="Cancel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
          <button type="button" class="icon-btn danger" id="selectDelete" title="Delete selected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
          </button>
        </div>
      </div>
    </header>

    <section class="feed" id="feed" aria-live="polite"></section>

    <nav class="bottom-nav">
      <button type="button" class="nav-item active" data-tab="sms">
        <span class="dot-count" id="count-sms">0</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        SMS
      </button>
      <button type="button" class="nav-item" data-tab="social">
        <span class="dot-count" id="count-social">0</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg>
        Social
      </button>
      <button type="button" class="nav-item" data-tab="calls">
        <span class="dot-count" id="count-calls">0</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Calls
      </button>
    </nav>

    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <aside class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head" id="sheetHead">
        <div class="avatar" id="sheetAvatar">?</div>
        <div class="sheet-head-text">
          <h2 id="sheetTitle">—</h2>
          <p id="sheetSubtitle">—</p>
        </div>
        <button type="button" class="sheet-close" id="sheetClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </aside>
  </div>

  <script>
    const TABS = {
      sms: { title: "Messages", empty: "No conversations yet", match: (t) => t === "SMS" },
      social: {
        title: "Social",
        empty: "No conversations yet",
        match: (t) => ["WHATSAPP", "TELEGRAM", "INSTAGRAM", "SOCIAL", "NOTIFICATION"].includes(t),
      },
      calls: {
        title: "Calls",
        empty: "No calls yet",
        match: (t) => ["CALL", "CALL_LOG", "CALLS"].includes(t),
      },
    };

    const app = document.getElementById("app");
    const feed = document.getElementById("feed");
    const pageTitle = document.getElementById("pageTitle");
    const searchBox = document.getElementById("searchBox");
    const searchInput = document.getElementById("searchInput");
    const searchToggle = document.getElementById("searchToggle");
    const searchClear = document.getElementById("searchClear");
    const selectBar = document.getElementById("selectBar");
    const selectCount = document.getElementById("selectCount");
    const sheet = document.getElementById("sheet");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const sheetBody = document.getElementById("sheetBody");

    function updateFeedScrollEdges() {
      const max = feed.scrollHeight - feed.clientHeight;
      const top = feed.scrollTop;
      feed.classList.toggle("can-scroll-up", top > 2);
      feed.classList.toggle("can-scroll-down", max > 2 && top < max - 2);
    }

    let activeTab = "sms";
    let allItems = [];
    let searchQuery = "";
    let selecting = false;
    let selectedIds = new Set();
    let openConversation = null;
    let currentVersion = 0;
    let watchAbort = null;
    let watching = false;
    const backBtn = document.getElementById("backBtn");

    const lucide = (inner) =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

    const ICONS = {
      trash: lucide(`<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>`),
      check: lucide(`<path d="M20 6 9 17l-5-5"/>`),
      messageCircle: lucide(`<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>`),
      send: lucide(`<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>`),
      camera: lucide(`<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>`),
      phone: lucide(`<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>`),
      phoneIncoming: lucide(`<polyline points="16 2 16 8 22 8"/><line x1="22" x2="16" y1="2" y2="8"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>`),
      phoneOutgoing: lucide(`<polyline points="22 8 22 2 16 2"/><line x1="16" x2="22" y1="8" y2="2"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>`),
      phoneMissed: lucide(`<line x1="22" x2="16" y1="2" y2="8"/><line x1="16" x2="22" y1="2" y2="8"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>`),
    };

    const trashIcon = ICONS.trash;
    const checkIcon = ICONS.check;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function normalizeType(value) {
      return String(value || "").trim().toUpperCase();
    }

    function isRtl(text) {
      return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(String(text || ""));
    }

    function initials(value) {
      const text = String(value || "?").trim();
      if (!text) return "?";
      const parts = text.replace(/^\+/, "").split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function eventTime(item) {
      return item?.timestamp || item?.receivedAt || 0;
    }

    function formatWhen(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      const now = new Date();
      const diff = now - d;
      if (diff < 60_000) return "now";
      if (diff < 3_600_000) return `${Math.floor(diff / 60_000)} min`;
      if (diff < 86_400_000 && d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }
      if (diff < 172_800_000) return "1 day";
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function formatExact(ms) {
      if (!ms) return "";
      return new Date(ms).toLocaleString(undefined, {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
    }

    function formatClock(ms) {
      if (!ms) return "";
      return new Date(ms).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    function sortNewestFirst(items) {
      return [...items].sort((a, b) => {
        const aTime = Number(a?.timestamp ?? a?.receivedAt ?? 0);
        const bTime = Number(b?.timestamp ?? b?.receivedAt ?? 0);
        if (bTime !== aTime) return bTime - aTime;
        return Number(b?.receivedAt ?? 0) - Number(a?.receivedAt ?? 0);
      });
    }

    function parseCall(item) {
      const parts = String(item.content || "").split("·").map((p) => p.trim()).filter(Boolean);
      const direction = parts[0] || "Call";
      const number = parts[1] || item.sender || "";
      const duration = (parts[2] || "").replace(/^duration\s*=\s*/i, "").trim();
      const kind = /missed/i.test(direction)
        ? "missed"
        : /outgoing/i.test(direction)
          ? "outgoing"
          : /incoming/i.test(direction)
            ? "incoming"
            : "other";
      return { direction, number, duration, kind };
    }

    const socialIcons = {
      WHATSAPP: ICONS.messageCircle,
      TELEGRAM: ICONS.send,
      INSTAGRAM: ICONS.camera,
    };

    const callIcons = {
      incoming: ICONS.phoneIncoming,
      outgoing: ICONS.phoneOutgoing,
      missed: ICONS.phoneMissed,
      other: ICONS.phone,
    };

    function socialClass(type) {
      if (type === "WHATSAPP") return "wa";
      if (type === "TELEGRAM") return "tg";
      if (type === "INSTAGRAM") return "ig";
      return "tg";
    }

    function socialLabel(type) {
      if (type === "WHATSAPP") return "WhatsApp";
      if (type === "TELEGRAM") return "Telegram";
      if (type === "INSTAGRAM") return "Instagram";
      return type;
    }

    function matchesSearch(item) {
      const q = searchQuery.trim().toLowerCase();
      if (!q) return true;
      return [item.sender, item.content, item.messageType]
        .filter(Boolean)
        .some((v) => String(v).toLowerCase().includes(q));
    }

    function wrapSwipe(innerHtml, id) {
      return `
        <div class="swipe" data-swipe-id="${escapeHtml(id)}">
          <div class="swipe-actions" data-action="swipe-delete" data-id="${escapeHtml(id)}">${trashIcon}</div>
          <div class="swipe-front">${innerHtml}</div>
        </div>`;
    }

    function checkHtml(id) {
      const on = selectedIds.has(id);
      return `<div class="check">${on ? checkIcon : ""}</div>`;
    }

    function conversationKey(item) {
      return String(item.sender || "Unknown").trim() || "Unknown";
    }

    function softKey(item) {
      return [
        normalizeType(item.messageType),
        String(item.sender || "").trim(),
        String(item.content || "").trim(),
      ].join("|");
    }

    function dedupeItems(items) {
      const best = new Map();
      for (const item of items) {
        const key = softKey(item);
        const prev = best.get(key);
        if (!prev || eventTime(item) >= eventTime(prev)) best.set(key, item);
      }
      return [...best.values()];
    }

    function isUnread(item) {
      return Boolean(item) && item.read !== true;
    }

    function buildConversations(items) {
      const map = new Map();
      for (const item of items) {
        const key = conversationKey(item);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      }
      return [...map.entries()]
        .map(([sender, messages]) => {
          const sorted = sortNewestFirst(messages);
          const unread = sorted.filter(isUnread).length;
          return {
            sender,
            messages: sorted,
            latest: sorted[0],
            ids: sorted.map((m) => m.id),
            count: sorted.length,
            unread,
          };
        })
        .sort((a, b) => eventTime(b.latest) - eventTime(a.latest));
    }

    function renderConversation(conv, kind) {
      const latest = conv.latest;
      const type = normalizeType(latest.messageType);
      const rtl = isRtl(latest.content) ? "rtl" : "";
      const selected = conv.ids.some((id) => selectedIds.has(id)) ? "selected" : "";
      const unreadCls = conv.unread > 0 ? "unread" : "";
      const selectKey = conv.ids[0];

      let avatarHtml = "";
      if (kind === "sms") {
        avatarHtml = `<div class="avatar sms" data-open="contact">${escapeHtml(initials(conv.sender))}</div>`;
      } else {
        const cls = socialClass(type);
        const icon = socialIcons[type] || socialIcons.TELEGRAM;
        avatarHtml = `
          <div class="avatar ${cls}" data-open="contact">
            ${escapeHtml(initials(conv.sender))}
            <span class="badge-app ${cls}">${icon}</span>
          </div>`;
      }

      const html = `
        <article class="row ${selected} ${unreadCls}" data-conversation="${escapeHtml(conv.sender)}" data-id="${escapeHtml(selectKey)}" data-ids="${escapeHtml(conv.ids.join(","))}">
          ${checkHtml(selectKey)}
          ${avatarHtml}
          <div class="row-main" data-open="conversation">
            <div class="row-top"><p class="name">${escapeHtml(conv.sender)}</p></div>
            <p class="preview ${rtl}">${escapeHtml(latest.content || "")}</p>
          </div>
          <div class="meta-col" data-open="conversation">
            <span class="when">${escapeHtml(formatWhen(eventTime(latest)))}</span>
            ${conv.unread > 0 ? `<span class="count-badge">${conv.unread > 99 ? "99+" : conv.unread}</span>` : ""}
          </div>
        </article>`;
      return selecting ? html : wrapSwipe(html, selectKey);
    }

    function renderThreadMessage(item) {
      const rtl = isRtl(item.content) ? "rtl" : "";
      const selected = selectedIds.has(item.id) ? "selected" : "";
      const html = `
        <article class="msg-block ${selected}" data-id="${escapeHtml(item.id)}" data-sender="${escapeHtml(item.sender || "")}">
          <div class="msg-meta">
            ${selecting ? checkHtml(item.id) : ""}
            <span class="at">${escapeHtml(formatExact(eventTime(item)))}</span>
          </div>
          <p class="bubble ${rtl}" data-open="message">${escapeHtml(item.content)}</p>
        </article>`;
      return selecting ? html : wrapSwipe(html, item.id);
    }

    function renderCall(item) {
      const parsed = parseCall(item);
      const icon = callIcons[parsed.kind] || callIcons.other;
      const preview = [parsed.direction, parsed.duration].filter(Boolean).join(" · ");
      const selected = selectedIds.has(item.id) ? "selected" : "";
      const unreadCls = isUnread(item) ? "unread" : "";
      const html = `
        <article class="row ${selected} ${unreadCls}" data-id="${escapeHtml(item.id)}" data-sender="${escapeHtml(item.sender || "")}">
          ${checkHtml(item.id)}
          <div class="avatar ${parsed.kind}" data-open="contact">${icon}</div>
          <div class="row-main" data-open="message">
            <div class="row-top"><p class="name">${escapeHtml(item.sender)}</p></div>
            <p class="preview">${escapeHtml(preview || parsed.number)}</p>
          </div>
          <div class="meta-col" data-open="message">
            <span class="when">${escapeHtml(formatWhen(eventTime(item)))}</span>
            ${isUnread(item) ? `<span class="count-badge">1</span>` : ""}
          </div>
        </article>`;
      return selecting ? html : wrapSwipe(html, item.id);
    }

    function filteredItems() {
      return sortNewestFirst(
        dedupeItems(
          allItems.filter((item) =>
            TABS[activeTab].match(normalizeType(item.messageType)) && matchesSearch(item)
          )
        )
      );
    }

    function updateCounts() {
      const smsItems = dedupeItems(allItems.filter((i) => TABS.sms.match(normalizeType(i.messageType))));
      const socialItems = dedupeItems(allItems.filter((i) => TABS.social.match(normalizeType(i.messageType))));
      const callItems = dedupeItems(allItems.filter((i) => TABS.calls.match(normalizeType(i.messageType))));
      const map = {
        sms: buildConversations(smsItems).reduce((n, c) => n + c.unread, 0),
        social: buildConversations(socialItems).reduce((n, c) => n + c.unread, 0),
        calls: callItems.filter(isUnread).length,
      };
      for (const [key, value] of Object.entries(map)) {
        const el = document.getElementById(`count-${key}`);
        el.textContent = value > 99 ? "99+" : String(value);
        el.classList.toggle("show", value > 0);
      }
    }

    function softKeySiblings(ids) {
      const seed = new Set((ids || []).map(String).filter(Boolean));
      if (!seed.size) return [];
      const keys = new Set(
        allItems
          .filter((item) => seed.has(String(item.id)))
          .map((item) => softKey(item))
      );
      return allItems
        .filter((item) => keys.has(softKey(item)))
        .map((item) => String(item.id));
    }

    function unreadDuplicatesOfRead() {
      const readKeys = new Set(
        allItems.filter((item) => item.read === true).map((item) => softKey(item))
      );
      if (!readKeys.size) return [];
      return allItems
        .filter((item) => isUnread(item) && readKeys.has(softKey(item)))
        .map((item) => String(item.id));
    }

    let markingRead = false;
    async function markIdsRead(ids) {
      const unique = [...new Set(softKeySiblings(ids))];
      if (!unique.length || markingRead) return;
      const pending = unique.filter((id) => {
        const item = allItems.find((entry) => String(entry.id) === id);
        return item && item.read !== true;
      });
      if (!pending.length) return;

      markingRead = true;
      for (const item of allItems) {
        if (pending.includes(String(item.id))) item.read = true;
      }
      paint();
      try {
        await fetch("/api/sync/messages/read", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: pending }),
        });
      } catch (_) {
        /* keep optimistic local read state */
      } finally {
        markingRead = false;
      }
    }

    function healDuplicateUnread() {
      const orphans = unreadDuplicatesOfRead();
      if (!orphans.length) return;
      markIdsRead(orphans);
    }

    function updateSelectBar() {
      selectBar.classList.toggle("open", selecting);
      selectCount.textContent = `${selectedIds.size} selected`;
      app.classList.toggle("selecting", selecting);
    }

    function updateChrome() {
      const inChat = Boolean(openConversation) && (activeTab === "sms" || activeTab === "social");
      app.classList.toggle("in-chat", inChat);
      backBtn.classList.toggle("show", inChat);
      pageTitle.classList.toggle("chat-title", inChat);
      pageTitle.textContent = inChat ? openConversation : TABS[activeTab].title;
      searchToggle.style.display = inChat ? "none" : "";
      if (inChat && searchBox.classList.contains("open")) {
        searchBox.classList.remove("open");
        searchToggle.classList.remove("active");
      }
    }

    function paint() {
      updateCounts();
      updateSelectBar();
      updateChrome();

      const items = filteredItems();

      if (openConversation && (activeTab === "sms" || activeTab === "social")) {
        const thread = sortNewestFirst(
          items.filter((item) => conversationKey(item) === openConversation)
        ).reverse();
        if (thread.length) {
          const unreadIds = thread.filter(isUnread).map((m) => m.id);
          if (unreadIds.length) markIdsRead(unreadIds);
          feed.innerHTML = `<div class="chat-thread">${thread.map(renderThreadMessage).join("")}</div>`;
          bindSwipeHandlers();
          requestAnimationFrame(() => {
            feed.scrollTop = feed.scrollHeight;
            updateFeedScrollEdges();
          });
          return;
        }
        openConversation = null;
        updateChrome();
      }

      if (!items.length) {
        feed.innerHTML = `<div class="empty">${escapeHtml(
          searchQuery.trim() ? "No results for this search" : TABS[activeTab].empty
        )}</div>`;
        updateFeedScrollEdges();
        return;
      }

      if (activeTab === "sms") {
        feed.innerHTML = buildConversations(items).map((c) => renderConversation(c, "sms")).join("");
      } else if (activeTab === "social") {
        feed.innerHTML = buildConversations(items).map((c) => renderConversation(c, "social")).join("");
      } else {
        feed.innerHTML = items.map(renderCall).join("");
      }
      bindSwipeHandlers();
      requestAnimationFrame(updateFeedScrollEdges);
    }

    function closeConversation() {
      openConversation = null;
      if (selecting) exitSelect();
      else paint();
    }

    function fillAvatar(el, item) {
      const type = normalizeType(item.messageType);
      el.className = "avatar";
      el.innerHTML = "";
      if (type === "SMS") {
        el.classList.add("sms");
        el.textContent = initials(item.sender);
      } else if (["WHATSAPP", "TELEGRAM", "INSTAGRAM"].includes(type)) {
        const cls = socialClass(type);
        el.classList.add(cls);
        el.textContent = initials(item.sender);
        const badge = document.createElement("span");
        badge.className = `badge-app ${cls}`;
        badge.innerHTML = socialIcons[type] || socialIcons.TELEGRAM;
        el.appendChild(badge);
      } else {
        const parsed = parseCall(item);
        el.classList.add(parsed.kind);
        el.innerHTML = callIcons[parsed.kind] || callIcons.other;
      }
    }

    function typeLabelFor(item) {
      const type = normalizeType(item.messageType);
      if (type === "SMS") return "SMS";
      if (["WHATSAPP", "TELEGRAM", "INSTAGRAM"].includes(type)) return socialLabel(type);
      if (["CALL", "CALL_LOG", "CALLS"].includes(type)) return "Call · " + parseCall(item).direction;
      return type || "Message";
    }

    let sheetCloseTimer = null;

    function showSheet() {
      if (sheetCloseTimer) {
        clearTimeout(sheetCloseTimer);
        sheetCloseTimer = null;
      }
      app.classList.remove("sheet-closing");
      app.classList.add("sheet-open");
      sheet.classList.add("open");
      sheetBackdrop.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      sheetBody.scrollTop = 0;
    }

    function openMessageSheet(item) {
      if (!item) return;
      const typeLabel = typeLabelFor(item);
      const rtl = isRtl(item.content) ? "rtl" : "";

      fillAvatar(document.getElementById("sheetAvatar"), item);
      document.getElementById("sheetTitle").textContent = item.sender || "Unknown";
      document.getElementById("sheetSubtitle").textContent =
        typeLabel + " · " + formatWhen(eventTime(item));

      sheetBody.innerHTML = `
        <div class="sheet-bubble ${rtl}">${escapeHtml(item.content || "")}</div>
        <div class="sheet-meta">
          <div class="sheet-meta-row"><span>From</span><strong>${escapeHtml(item.sender || "—")}</strong></div>
          <div class="sheet-meta-row"><span>Type</span><strong>${escapeHtml(typeLabel)}</strong></div>
          <div class="sheet-meta-row"><span>Time</span><strong>${escapeHtml(formatExact(eventTime(item)))}</strong></div>
        </div>`;

      showSheet();
      if (isUnread(item)) markIdsRead([item.id]);
    }

    function openContactSheet(sender) {
      const messages = sortNewestFirst(
        dedupeItems(
          allItems.filter((item) => String(item.sender || "") === String(sender || ""))
        )
      );
      if (!messages.length) return;
      const latest = messages[0];

      const byType = {};
      for (const m of messages) {
        const label = typeLabelFor(m).split(" · ")[0];
        byType[label] = (byType[label] || 0) + 1;
      }
      const typeSummary = Object.entries(byType)
        .map(([k, v]) => `${k} ${v}`)
        .join(" · ");

      fillAvatar(document.getElementById("sheetAvatar"), latest);
      document.getElementById("sheetTitle").textContent = sender || "Unknown";
      document.getElementById("sheetSubtitle").textContent =
        `${messages.length} item${messages.length === 1 ? "" : "s"} · ${typeSummary}`;

      sheetBody.innerHTML = `
        <div class="sheet-meta">
          <div class="sheet-meta-row"><span>Contact</span><strong>${escapeHtml(sender || "—")}</strong></div>
          <div class="sheet-meta-row"><span>Last seen</span><strong>${escapeHtml(formatExact(eventTime(latest)))}</strong></div>
          <div class="sheet-meta-row"><span>Total</span><strong>${messages.length}</strong></div>
        </div>
        <p class="sheet-section-title">Recent</p>
        <div class="sheet-list">
          ${messages.slice(0, 8).map((m) => {
            const rtl = isRtl(m.content) ? "rtl" : "";
            return `
              <div class="sheet-list-item">
                <span class="when">${escapeHtml(formatWhen(eventTime(m)))} · ${escapeHtml(typeLabelFor(m))}</span>
                <span class="text ${rtl}">${escapeHtml(m.content || "")}</span>
              </div>`;
          }).join("")}
        </div>`;

      showSheet();
    }

    function closeSheet(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      if (!sheet.classList.contains("open") && !app.classList.contains("sheet-open")) return;

      app.classList.add("sheet-closing");
      app.classList.remove("sheet-open");
      sheet.classList.remove("open");
      sheetBackdrop.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");

      if (sheetCloseTimer) clearTimeout(sheetCloseTimer);
      sheetCloseTimer = setTimeout(() => {
        app.classList.remove("sheet-closing");
        sheetCloseTimer = null;
      }, 320);
    }

    function idsForElement(el) {
      if (!el) return [];
      if (el.dataset.ids) return el.dataset.ids.split(",").filter(Boolean);
      if (el.dataset.id) return [el.dataset.id];
      return [];
    }

    function enterSelect(id) {
      selecting = true;
      selectedIds = new Set(id ? [id] : []);
      closeAllSwipes();
      paint();
    }

    function exitSelect() {
      selecting = false;
      selectedIds = new Set();
      paint();
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      if (!selectedIds.size) exitSelect();
      else paint();
    }

    function expandSelectedIds() {
      const expanded = new Set();
      for (const id of selectedIds) {
        const row = [...feed.querySelectorAll("[data-id]")].find((el) => el.dataset.id === id);
        const ids = idsForElement(row);
        if (ids.length) ids.forEach((x) => expanded.add(x));
        else expanded.add(id);
      }
      return [...expanded];
    }

    async function deleteIds(ids) {
      if (!ids.length) return;
      const res = await fetch("/api/sync/messages/bulk-delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids }),
      });
      if (!res.ok) throw new Error("delete failed");
      const data = await res.json();
      if (typeof data.version === "number") currentVersion = data.version;
      allItems = allItems.filter((item) => !ids.includes(item.id));
      ids.forEach((id) => selectedIds.delete(id));
      if (selecting && !selectedIds.size) selecting = false;
      paint();
    }

    function closeAllSwipes(except) {
      feed.querySelectorAll(".swipe-front").forEach((el) => {
        if (el !== except) el.style.transform = "translateX(0)";
      });
    }

    function bindSwipeHandlers() {
      feed.querySelectorAll(".swipe").forEach((swipe) => {
        const front = swipe.querySelector(".swipe-front");
        if (!front || front.dataset.bound) return;
        front.dataset.bound = "1";

        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let dragging = false;
        let opened = false;

        const onStart = (x, y) => {
          if (selecting) return;
          startX = x;
          startY = y;
          currentX = 0;
          dragging = true;
          front.style.transition = "none";
          closeAllSwipes(front);
        };

        const onMove = (x, y, event) => {
          if (!dragging || selecting) return;
          const dx = x - startX;
          const dy = y - startY;
          if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) {
            dragging = false;
            front.style.transition = "transform 0.18s ease";
            front.style.transform = opened ? "translateX(76px)" : "translateX(0)";
            return;
          }
          if (dx > 0) {
            event.preventDefault?.();
            currentX = Math.min(76, dx);
            front.style.transform = `translateX(${currentX}px)`;
          }
        };

        const onEnd = () => {
          if (!dragging) return;
          dragging = false;
          front.style.transition = "transform 0.18s ease";
          opened = currentX > 38;
          front.style.transform = opened ? "translateX(76px)" : "translateX(0)";
        };

        front.addEventListener("touchstart", (e) => {
          const t = e.touches[0];
          onStart(t.clientX, t.clientY);
        }, { passive: true });

        front.addEventListener("touchmove", (e) => {
          const t = e.touches[0];
          onMove(t.clientX, t.clientY, e);
        }, { passive: false });

        front.addEventListener("touchend", onEnd);
        front.addEventListener("touchcancel", onEnd);
      });
    }

    // Click / long-press handling
    let pressTimer = null;
    let pressMoved = false;
    let pressTarget = null;

    feed.addEventListener("scroll", updateFeedScrollEdges, { passive: true });
    window.addEventListener("resize", updateFeedScrollEdges);

    feed.addEventListener("pointerdown", (event) => {
      const itemEl = event.target.closest("[data-id]");
      if (!itemEl) return;
      pressMoved = false;
      pressTarget = itemEl;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        if (!pressMoved && pressTarget) {
          const ids = idsForElement(pressTarget);
          enterSelect(ids[0] || pressTarget.dataset.id);
          pressTarget = null;
        }
      }, 480);
    });

    feed.addEventListener("pointermove", () => {
      pressMoved = true;
      clearTimeout(pressTimer);
    });

    feed.addEventListener("pointerup", () => clearTimeout(pressTimer));
    feed.addEventListener("pointercancel", () => clearTimeout(pressTimer));

    feed.addEventListener("click", async (event) => {
      const swipeDelete = event.target.closest("[data-action='swipe-delete']");
      if (swipeDelete) {
        event.preventDefault();
        const swipeRow = swipeDelete.closest(".swipe")?.querySelector("[data-id]");
        const ids = idsForElement(swipeRow);
        await deleteIds(ids.length ? ids : [swipeDelete.dataset.id]);
        return;
      }

      const itemEl = event.target.closest("[data-id]");
      if (!itemEl) return;
      const id = itemEl.dataset.id;

      if (selecting) {
        toggleSelect(id);
        return;
      }

      const openType = event.target.closest("[data-open]")?.dataset.open;

      if (itemEl.dataset.conversation && (openType === "conversation" || openType === "contact" || !openType)) {
        if (openType === "contact" || event.target.closest(".avatar")) {
          openContactSheet(itemEl.dataset.conversation);
          return;
        }
        openConversation = itemEl.dataset.conversation;
        paint();
        return;
      }

      const item = allItems.find((entry) => entry.id === id);
      if (!item) return;

      if (openType === "contact" || event.target.closest(".avatar")) {
        openContactSheet(item.sender);
        return;
      }

      openMessageSheet(item);
    });

    async function loadMessages() {
      try {
        const res = await fetch("/api/sync/messages", { cache: "no-store" });
        if (!res.ok) throw new Error("Failed");
        const data = await res.json();
        allItems = sortNewestFirst(Array.isArray(data.items) ? data.items : []);
        if (typeof data.version === "number") currentVersion = data.version;
        paint();
        healDuplicateUnread();
      } catch (_) {
        if (!feed.children.length) {
          feed.innerHTML = `<div class="empty">Could not reach the API</div>`;
        }
      }
    }

    async function watchForUpdates() {
      if (watching) return;
      watching = true;
      while (watching) {
        if (document.hidden) {
          await new Promise((resolve) => {
            const onVisible = () => {
              if (!document.hidden) {
                document.removeEventListener("visibilitychange", onVisible);
                resolve();
              }
            };
            document.addEventListener("visibilitychange", onVisible);
          });
          await loadMessages();
          continue;
        }
        watchAbort = new AbortController();
        try {
          const res = await fetch(`/api/sync/wait?since=${currentVersion}&timeout=20000`, {
            cache: "no-store",
            signal: watchAbort.signal,
          });
          if (!res.ok) throw new Error("wait failed");
          const data = await res.json();
          if (data.changed) {
            currentVersion = data.version;
            await loadMessages();
          } else if (typeof data.version === "number") {
            currentVersion = data.version;
          }
        } catch (err) {
          if (err?.name === "AbortError") break;
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
    }

    searchToggle.addEventListener("click", () => {
      const open = searchBox.classList.toggle("open");
      searchToggle.classList.toggle("active", open);
      if (open) searchInput.focus();
      else {
        searchQuery = "";
        searchInput.value = "";
        searchClear.classList.remove("show");
        paint();
      }
    });

    searchInput.addEventListener("input", () => {
      searchQuery = searchInput.value;
      searchClear.classList.toggle("show", Boolean(searchQuery));
      paint();
    });

    searchClear.addEventListener("click", () => {
      searchQuery = "";
      searchInput.value = "";
      searchClear.classList.remove("show");
      searchInput.focus();
      paint();
    });

    document.getElementById("selectCancel").addEventListener("click", exitSelect);
    document.getElementById("selectDelete").addEventListener("click", async () => {
      const ids = expandSelectedIds();
      if (!ids.length) return;
      if (!confirm(`Delete ${ids.length} item(s)?`)) return;
      await deleteIds(ids);
    });

    backBtn.addEventListener("click", closeConversation);
    pageTitle.addEventListener("click", () => {
      if (openConversation) openContactSheet(openConversation);
    });

    const sheetCloseBtn = document.getElementById("sheetClose");
    sheetCloseBtn.addEventListener("click", closeSheet);
    sheetCloseBtn.addEventListener("pointerup", (e) => {
      if (e.pointerType === "touch") closeSheet(e);
    });
    sheetBackdrop.addEventListener("click", closeSheet);
    sheet.addEventListener("click", (e) => e.stopPropagation());
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeSheet(e);
        if (selecting) exitSelect();
        else if (openConversation) closeConversation();
      }
    });

    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        openConversation = null;
        document.querySelectorAll(".nav-item").forEach((el) => el.classList.toggle("active", el === btn));
        if (selecting) exitSelect();
        else paint();
      });
    });

    document.getElementById("refreshBtn").addEventListener("click", loadMessages);
    document.getElementById("clearBtn").addEventListener("click", async () => {
      if (!confirm("Clear all messages?")) return;
      await fetch("/api/sync/messages", { method: "DELETE" });
      selectedIds = new Set();
      selecting = false;
      await loadMessages();
    });

    window.addEventListener("beforeunload", () => {
      watching = false;
      watchAbort?.abort();
    });
    loadMessages().then(watchForUpdates);
  </script>
</body>
</html>
